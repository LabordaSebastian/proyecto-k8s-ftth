kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ftth-cluster
nodes:
  - role: control-plane
    extraPortMappings:
    - containerPort: 30080
      hostPort: 30080
      protocol: TCP
    - containerPort: 30088  # KubeView - visualización del clúster
      hostPort: 30088
      protocol: TCP
  - role: worker
    labels:
      role: database
      disktype: ssd
