site_name: Proyecto FTTH - Kubernetes PoC
site_description: Documentación oficial de la Prueba de Concepto de FTTH en Kubernetes.
site_author: Sebastian Laborda

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Getting Started:
      - getting-started/index.md
      - kind-config.yaml: getting-started/kind-config.md
      - manage-env.sh: getting-started/manage-env.md
  - Operaciones (CI/CD):
      - operations/index.md
      - ci-cd.yml: operations/ci-cd-pipeline.md
      - docs.yml: operations/docs-pipeline.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
