site_name: Proyecto FTTH - Kubernetes PoC
site_description: Documentación técnica del laboratorio de Kubernetes para la preparación de la certificación CKA.
site_author: Sebastian Laborda

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Inicio: index.md
  - Getting Started:
      - getting-started/index.md
      - Infraestructura Local (Kind): getting-started/kind-config.md
      - Script de Automatización: getting-started/manage-env.md
  - Arquitectura:
      - architecture/index.md
      - Frontend (Nginx): architecture/frontend.md
      - Backend (API Python): architecture/backend.md
      - Base de Datos (Redis): architecture/redis.md
      - Monitoreo de Red (CronJob): architecture/cronjob.md
      - Autoscaling (VPA): architecture/autoscaling.md
  - Conceptos Claves (CKA): architecture/cka-concepts.md
  - Harness Engineering:
      - harness-engineering/index.md
      - Anatomía de los Agentes: harness-engineering/agents.md
      - HarnessDB (Memoria Persistente): harness-engineering/harness-db.md
      - ADR 001 - Unificación de Skills: harness-engineering/adr-001-unification-skills.md
  - Manifiestos K8s:
      - manifests/index.md
      - Deployments: manifests/deployments.md
      - Services: manifests/services.md
      - ConfigMaps: manifests/configmaps.md
      - Metrics Server: manifests/metrics-server.md
      - Autoscaling (HPA/VPA): manifests/autoscaling.md
  - Operaciones (CI/CD):
      - operations/index.md
      - Pipeline de Despliegue: operations/ci-cd-pipeline.md
      - Pipeline de Documentación: operations/docs-pipeline.md
  - Seguridad:
      - security/index.md
      - Cifrado en Reposo (etcd): security/encryption-at-rest.md
      - Endurecimiento de Arquitectura: security/architecture-hardening.md
  - Skills:
      - skills/index.md
      - Guía de Estilo de Documentación: skills/doc-style-guide.md
  - Herramientas:
      - tools/index.md
      - Codegraph: tools/codegraph.md
