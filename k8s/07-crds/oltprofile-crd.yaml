apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oltprofiles.infrastructure.ftth.com
spec:
  group: infrastructure.ftth.com
  names:
    plural: oltprofiles
    singular: oltprofile
    kind: OltProfile
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                manufacturer:
                  type: string
                maxBandwidthGbps:
                  type: integer
                  minimum: 1
                  maximum: 100
                uplinkPorts:
                  type: integer
                  minimum: 1
                  maximum: 8
              required: ["manufacturer", "maxBandwidthGbps"]
