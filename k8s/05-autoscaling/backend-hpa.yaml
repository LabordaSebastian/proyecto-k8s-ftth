apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ftth-backend-hpa
  labels:
    app: ftth-backend
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ftth-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
