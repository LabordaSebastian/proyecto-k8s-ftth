apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftth-dns
  labels:
    app: ftth-dns
    tier: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ftth-dns
  template:
    metadata:
      labels:
        app: ftth-dns
    spec:
      containers:
      - name: coredns
        image: coredns/coredns:1.11.1
        imagePullPolicy: IfNotPresent
        args: [ "-conf", "/etc/coredns/Corefile" ]
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config-volume
        configMap:
          name: ftth-dns-config
          items:
          - key: Corefile
            path: Corefile
