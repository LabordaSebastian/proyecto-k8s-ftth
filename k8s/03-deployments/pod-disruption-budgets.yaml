apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ftth-backend-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ftth-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ftth-frontend-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ftth-frontend
