apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftth-backend
  labels:
    app: ftth-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ftth-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ftth-backend
    spec:
       containers:
       - name: python-api
         image: ftth-backend:v1
         imagePullPolicy: Never # Crucial: Le dice a K8s que no busque en internet, que use la que inyectamos
         ports:
         - containerPort: 5000
         env:
         - name: REDIS_HOST
           value: "ftth-redis-service" # El DNS de tu Service
         resources:
           requests:
             memory: "64Mi"
             cpu: "50m"
           limits:
             memory: "128Mi"
             cpu: "100m"
         readinessProbe:
           httpGet:
             path: /health
             port: 5000
           initialDelaySeconds: 5
           periodSeconds: 10
           timeoutSeconds: 2
           failureThreshold: 3
         livenessProbe:
           httpGet:
             path: /health
             port: 5000
           initialDelaySeconds: 15
           periodSeconds: 20
           timeoutSeconds: 2
           failureThreshold: 3
         lifecycle:
           preStop:
             exec:
               command: ["/bin/sh", "-c", "sleep 30"]
