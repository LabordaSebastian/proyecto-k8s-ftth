apiVersion: v1
kind: Service
metadata:
  name: ftth-dns-service
spec:
  type: NodePort
  selector:
    app: ftth-dns
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns
      nodePort: 30053
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
      nodePort: 30053
