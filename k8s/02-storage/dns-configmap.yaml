apiVersion: v1
kind: ConfigMap
metadata:
  name: ftth-dns-config
  namespace: default
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
    ftth.local:53 {
        errors
        hosts {
            192.168.1.100 test.ftth.local
            fallthrough
        }
        log
    }
